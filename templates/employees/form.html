
{% extends "base.html" %}

{% block title %}{{ page_title }} | WORKFLOW{% endblock %}

{% block content %}

<div class="mb-4">
    <h2 class="fw-bold">{{ page_title }}</h2>
    <p class="text-muted">
        Enter the employee information below.
    </p>
</div>

<div class="card shadow-sm">

    <div class="card-body p-4">

        <form method="POST">

            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <h5 class="text-success mb-3">Basic Information</h5>

            <div class="row g-3">

                <div class="col-md-6">
                    <label class="form-label">
                        Employee Number *
                    </label>

                    <input type="text"
                           name="employee_number"
                           class="form-control"
                           maxlength="50"
                           value="{{ employee.employee_number if employee else '' }}"
                           required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">First Name *</label>

                    <input type="text"
                           name="first_name"
                           class="form-control"
                           maxlength="100"
                           value="{{ employee.first_name if employee else '' }}"
                           required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Middle Name</label>

                    <input type="text"
                           name="middle_name"
                           class="form-control"
                           maxlength="100"
                           value="{{ employee.middle_name if employee and employee.middle_name else '' }}">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Last Name *</label>

                    <input type="text"
                           name="last_name"
                           class="form-control"
                           maxlength="100"
                           value="{{ employee.last_name if employee else '' }}"
                           required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Gender</label>

                    <select name="gender" class="form-select" required>
                        <option value="">Select Gender</option>

                        {% for gender in ["Male", "Female", "Other"] %}
                        <option value="{{ gender }}"
                            {% if employee and employee.gender == gender %}selected{% endif %}>
                            {{ gender }}
                        </option>
                        {% endfor %}

                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Birth Date</label>

                    <input type="date"
                           name="birth_date"
                           class="form-control"
                           required
                           value="{{ employee.birth_date.isoformat() if employee and employee.birth_date else '' }}">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Email Address</label>

                    <input type="email"
                           name="email"
                           class="form-control"
                           maxlength="120"
                           required
                           value="{{ employee.email if employee and employee.email else '' }}">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Contact Number</label>

                    <input type="text"
                           name="contact_number"
                           class="form-control"
                           maxlength="30"
                           required
                           value="{{ employee.contact_number if employee and employee.contact_number else '' }}">
                </div>

                <div class="col-12">
                    <label class="form-label">Address</label>

                    <textarea name="address"
                              class="form-control"
                              rows="3"
                              required>{{ employee.address if employee and employee.address else '' }}</textarea>
                </div>

            </div>

            <hr class="my-4">

            <h5 class="text-success mb-3">Employment Information</h5>

            <div class="row g-3">

                <div class="col-md-6">
                    <label class="form-label">Department</label>

                    <select name="department" class="form-select" required>

                        <option value="">Select Department</option>

                        {% for department in [
                            "Administration",
                            "Human Resources",
                            "Accounting",
                            "Purchasing",
                            "Warehouse",
                            "Sales",
                            "Operations",
                            "Construction"
                        ] %}

                        <option value="{{ department }}"
                            {% if employee and employee.department == department %}selected{% endif %}>
                            {{ department }}
                        </option>

                        {% endfor %}

                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Position</label>

                    <input type="text"
                           name="position"
                           class="form-control"
                           maxlength="100"
                           required
                           value="{{ employee.position if employee and employee.position else '' }}">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Employment Type</label>

                    <select name="employment_type" class="form-select" required>

                        <option value="">Select Employment Type</option>

                        {% for employment_type in [
                            "Regular",
                            "Probationary",
                            "Contractual",
                            "Part-time",
                            "Project-based"
                        ] %}

                        <option value="{{ employment_type }}"
                            {% if employee and employee.employment_type == employment_type %}selected{% endif %}>
                            {{ employment_type }}
                        </option>

                        {% endfor %}

                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Date Hired</label>

                    <input type="date"
                           name="date_hired"
                           class="form-control"
                           required
                           value="{{ employee.date_hired.isoformat() if employee and employee.date_hired else '' }}">
                </div>

            </div>

            <hr class="my-4">

            <div class="d-flex gap-2">

                <button type="submit" class="btn btn-success">
                    Save Employee
                </button>

                <a href="{{ url_for('employees.list_employees') }}"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </div>

            <p class="text-muted small mt-3 mb-0">
                * Required fields
            </p>

        </form>

    </div>

</div>

{% endblock %}
