{% extends "base.html" %}

{% block title %}Reset Password | WORKFLOW{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <div class="text-center mb-4">
            <img src="{{ url_for('static', filename='img/JERGA.jpg') }}" alt="WORKFLOW logo" width="64" height="64"
                class="mb-2">
            <h4 class="fw-bold text-success">Reset Password</h4>
            <p class="text-muted">Step 2 — Enter code and new password</p>
        </div>

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter your username"
                    value="{{ reset_username or '' }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">6-Digit Reset Code</label>
                <input type="text" name="code" class="form-control text-center fw-bold" placeholder="000000"
                    maxlength="6" pattern="\d{6}" inputmode="numeric" style="letter-spacing: 0.4em;" required>
            </div>

            <div class="mb-3">
                <label class="form-label">New Password</label>
                <input type="password" name="new_password" class="form-control" placeholder="Minimum 8 characters"
                    minlength="8" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Confirm New Password</label>
                <input type="password" name="confirm_password" class="form-control"
                    placeholder="Confirm your new password" minlength="8" required>
            </div>

            <button type="submit" class="btn btn-success w-100">
                Reset Password
            </button>

            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        </form>

        <div class="text-center mt-4">
            <a href="{{ url_for('auth.login') }}" class="small">Back to Login</a>
        </div>

    </div>

</div>

{% endblock %}
