
{% extends "base.html" %}

{% block title %}Register | WORKFLOW{% endblock %}

{% block content %}


<div class="auth-container">

    <div class="auth-card">

        <div class="text-center mb-4">
            <img src="{{ url_for('static', filename='img/JERGA.jpg') }}"
                 alt="WORKFLOW logo" width="64" height="64" class="mb-2">
            <h2 class="fw-bold text-success">WORKFLOW</h2>
            <h4>Create an Account</h4>
            <p class="text-muted">Employee account registration</p>
        </div>

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Choose a username"
                    maxlength="80"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="e.g. name@gmail.com"
                    maxlength="120"
                    pattern="[^@\s]+@[^@\s]+\.com"
                    title="Email must end in .com (e.g. name@gmail.com)"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Minimum 8 characters"
                    minlength="8"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label">Confirm Password</label>
                <input
                    type="password"
                    name="confirm_password"
                    class="form-control"
                    placeholder="Confirm your password"
                    minlength="8"
                    required
                >
            </div>

            <button type="submit" class="btn btn-success w-100">
                Create Account
            </button>

            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        </form>

        <div class="text-center mt-4">
            <p>
                Already have an account?
                <a href="{{ url_for('auth.login') }}">
                    Login here
                </a>
            </p>
        </div>

    </div>

</div>

{% endblock %}
