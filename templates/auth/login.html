
{% extends "base.html" %}

{% block title %}Login | WORKFLOW{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <div class="text-center mb-4">
            <img src="{{ url_for('static', filename='img/JERGA.jpg') }}"
                 alt="WORKFLOW logo" width="64" height="64" class="mb-2">
            <h2 class="fw-bold text-success">WORKFLOW</h2>
            <p class="text-muted">
                Employee Request and Approval Management System
            </p>
            <hr>
            <h4>Sign In</h4>
            <p class="text-muted">Access your account</p>
        </div>

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Enter your username"
                    required
                    autocomplete="username"
                >
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" class="btn btn-success w-100">
                Login
            </button>

            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        </form>

        <div class="text-center mt-3">
            <a href="{{ url_for('biometrics.face_login') }}"
               class="btn btn-outline-success w-100">
                Sign In with Face ID
            </a>
        </div>

        <div class="text-center mt-2">
            <a href="{{ url_for('auth.forgot_password') }}" class="text-muted small">
                Forgot Password?
            </a>
        </div>

        <div class="text-center mt-4">
            <p class="mb-0">
                Don't have an account?
                <a href="{{ url_for('auth.register') }}">
                    Register here
                </a>
            </p>
        </div>

    </div>

</div>

{% endblock %}
