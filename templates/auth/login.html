{% extends "base.html" %} {% block title %}Login | WORKFLOW{% endblock %} {%
block content %}

<div class="auth-container">
<div class="auth-card">
    <div class="text-center mb-4">
    <div class="auth-logo-wrap mx-auto mb-3">
        <img
        src="{{ url_for('static', filename='img/JERGA.jpg') }}"
        alt="JERGA WORKFLOW logo"
        class="auth-logo"
        />
    </div>
    <h2 class="fw-bold auth-brand">WORKFLOW</h2>
    <p class="text-muted auth-tagline mb-0">
        Employee Request and Approval Management System
    </p>
    </div>

    <div class="auth-divider"></div>

    <div class="auth-heading text-center mb-3">
    <h4>Welcome Back</h4>
    <p class="text-muted small mb-0">Sign in to access your account</p>
    </div>

    <form method="POST">
      <div class="mb-3">
        <label class="form-label auth-label">Username</label>
        <div class="auth-input-group">
          <i class="bi bi-person"></i>
          <input
            type="text"
            name="username"
            class="form-control"
            placeholder="Enter your username"
            required
            autocomplete="username"
          />
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label auth-label">Password</label>
        <div class="auth-input-group">
          <i class="bi bi-lock"></i>
          <input
            type="password"
            name="password"
            class="form-control"
            placeholder="Enter your password"
            required
            autocomplete="current-password"
          />
        </div>
      </div>

      <button type="submit" class="btn btn-success w-100 auth-submit">
        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
      </button>

      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    </form>

    <div class="text-center mt-3">
      <a
        href="{{ url_for('biometrics.face_login') }}"
        class="btn btn-outline-success w-100 auth-face-btn"
      >
        <i class="bi bi-person-bounding-box me-1"></i> Sign In with Face ID
      </a>
    </div>

    <div class="text-center mt-3">
      <a
        href="{{ url_for('auth.forgot_password') }}"
        class="auth-muted-link small"
      >
        Forgot Password?
      </a>
    </div>

    <div class="auth-divider my-4"></div>

    <p class="text-center text-muted mb-0 small">
      Don't have an account?
      <a href="{{ url_for('auth.register') }}" class="auth-link"
        >Register here</a
      >
    </p>
  </div>
</div>

{% endblock %}
